version: '3.8'

services:
  # Backend Flask API
  backend:
    build: ./backend
    container_name: waste-detection-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/waste_detection
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./ml-training/outputs:/app/models
      - uploads:/app/uploads
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Frontend React
  frontend:
    build: ./frontend
    container_name: waste-detection-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: waste-detection-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=waste_detection
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis pour Celery
  redis:
    image: redis:7-alpine
    container_name: waste-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Celery Worker (tâches asynchrones)
  celery:
    build: ./backend
    container_name: waste-detection-celery
    command: celery -A app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/waste_detection
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
